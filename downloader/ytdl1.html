<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
:root{--header-h:92px}
body{
    background:#1d1e22;color:#d8d8dc;
    font-family:"Courier New",Courier,monospace;
    overflow-x:hidden;
}
a{color:inherit}
.page{width:100%;max-width:720px;margin:0 auto;padding-top:var(--header-h);padding-bottom:82px}

/* HEADER */
.topbar{
    height:92px;
    min-height:92px;
    padding:14px 30px;
    display:flex;
    align-items:center;
    gap:14px;
    background:#24262b;
    border-bottom:1px solid #45474e;
    overflow:hidden;
}
.avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
    flex:0 0 58px;
    filter:grayscale(.2);
}
.identity{
    min-width:0;
    flex:1 1 auto;
}
.identity h1{
    font-family:Arial,sans-serif;
    font-size:1.2rem;
    font-weight:800;
    color:#f1f1f2;
    letter-spacing:-.25px;
    margin-bottom:4px;
    line-height:1.05;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.identity p{
    font-size:.78rem;
    color:#9c9da2;
    letter-spacing:1px;
    line-height:1.15;
    white-space:nowrap;
}
.social-top{
    display:flex;
    align-items:center;
    gap:7px;
    flex:0 0 auto;
    margin-left:auto;
}
.social-top a{
    width:48px;
    height:48px;
    background:#202228;
    border:1px solid #484a51;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#aeb0b6;
    font-size:1.25rem;
    transition:.15s ease;
}
.social-top a:active{
    background:#292a2f;
    transform:scale(.96);
}

/* CONTENT */
main{padding:0 30px}
.section{
    padding:24px 0 30px;
    border-bottom:1px solid #38393e;
    scroll-margin-top:8px;
}
.section:last-of-type{border-bottom:0}
.label{
    font-size:1.05rem;
    letter-spacing:6px;
    color:#e1e1e4;
    padding-bottom:25px;
    border-bottom:1px solid #44454a;
    margin-bottom:38px;
}

/* MOBILE */
@media(max-width:620px){
    .topbar{height:92px;min-height:92px;padding:14px 30px;gap:12px}
    .avatar{width:58px;height:58px;flex-basis:58px}
    .identity h1{font-size:1.18rem}
    .identity p{font-size:.76rem}

@media(max-width:480px){

/* TOOLS PAGE STYLES */

.tools-main{padding:0 30px;max-width:720px;margin:0 auto}

.tool-title{font-family:Arial,sans-serif;font-size:1.45rem;color:#f1f1f2;margin-bottom:10px}
.tool-desc{font-size:.82rem;line-height:1.75;color:#aaaab0;margin-bottom:22px}
.url-box{display:flex;flex-direction:column;gap:10px}
.url-input{width:100%;background:#1b1c20;border:1px solid #45464c;border-radius:10px;padding:14px;color:#eee;font-family:inherit;font-size:.8rem;outline:none}
.url-input:focus{border-color:#707178}
.download-btn{width:100%;height:48px;border:1px solid #5a5b61;background:#292a2f;color:#eee;border-radius:10px;font-family:inherit;font-size:.75rem;cursor:pointer}
.download-btn:active{transform:scale(.97);background:#33343a}
.type-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 16px}
.type-btn{border:1px solid #45464c;background:#1b1c20;color:#92939a;border-radius:9px;padding:11px 7px;font-family:inherit;font-size:.68rem;cursor:pointer}

.preview-media{

}

}
.photo-preview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px}
.photo-preview-item{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:8px;background:#0b0c0f;border:1px solid #34353b}
.photo-preview-item img{display:block;width:100%;height:100%;object-fit:cover}
.photo-preview-item span{position:absolute;left:7px;bottom:7px;padding:4px 7px;border-radius:6px;background:rgba(0,0,0,.72);color:#eee;font-size:.58rem}
.media-desc{
    margin:10px 0 14px;
    padding:13px 45px 13px 13px;
    border:1px solid #3b3c42;
    border-radius:10px;
    background:#222328;
    font-size:.72rem;
    line-height:1.7;
    color:#c9c9cd;
    white-space:pre-wrap;
    word-break:break-word;
    position:relative;
}
.media-desc-label{
    display:block;
    margin-bottom:6px;
    font-family:Arial,sans-serif;
    font-size:.62rem;
    font-weight:800;
    letter-spacing:1.5px;

}
.copy-desc{
    position:absolute;
    right:9px;
    top:9px;
    width:28px;
    height:28px;
    border:1px solid #45464c;
    background:#1b1c20;
    color:#bfc0c5;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s ease;
}
.copy-desc:active{transform:scale(.94);background:#292a2f}

.result{display:none;margin-top:16px;border:1px solid #3b3c42;border-radius:12px;padding:14px;background:#1b1c20}
.result.show{display:block}
.result-title{font-family:Arial,sans-serif;color:#eee;font-size:.85rem;margin-bottom:10px}
.result-actions{display:grid;gap:8px}
.result-actions a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid #45464c;border-radius:9px;padding:11px;color:#eee;font-size:.68rem}
.tool-note{margin-top:18px;font-size:.62rem;line-height:1.6;color:#777980}
.back-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid #45464c;border-radius:9px;padding:10px 13px;color:#bfc0c5;font-size:.68rem;margin-bottom:18px}
@media(max-width:480px){.tools-main{padding:0 30px}.downloader{padding:22px 16px}.tool-title{font-size:1.3rem}}
@media(max-width:390px){.tools-main{padding:0 20px}}

/* YOUTUBE DOWNLOADER — DISTINCT RESULT DESIGN */
.yt-card{

.yt-meta{padding:16px}
.yt-title{
    font-family:Arial,sans-serif;

}

.yt-result{

.yt-result.show{display:block}
.yt-format-title{

.yt-download-list{display:grid;gap:8px}
.yt-download-list a{

</style>

<body>
<div class="tools-page">
<header class="topbar">
    <img class="avatar" src="https://files.catbox.moe/e58766.jpg" alt="GIIKUN">

    </div>
</header>
<main class="tools-main">
<section class="tool-section">
<div class="tool-label">TOOLS</div>
<a class="back-btn" href="#" onclick="history.back(); return false;"><i class="fas fa-arrow-left"></i> BACK TO PORTFOLIO</a>
<div class="downloader">
<h2 class="tool-title">YouTube Downloader V1</h2>
<p class="tool-desc">Download video atau audio dari link YouTube publik.</p>

<div class="type-row">
<button class="type-btn active" data-type="video"><i class="fas fa-video"></i> VIDEO</button>
<button class="type-btn" data-type="audio"><i class="fas fa-volume-up"></i> AUDIO</button>
</div>

<div class="url-box">
<input class="url-input" id="youtubeUrl" type="url" placeholder="Tempel link YouTube di sini..." autocomplete="off">
<button class="download-btn" id="downloadBtn"><i class="fas fa-download"></i> DOWNLOAD</button>
</div>

<div class="status" id="status"></div>
<div class="yt-result" id="result">
<div class="result-title" id="resultTitle">Hasil download</div>
<div class="yt-card" id="ytCard">
  <div class="yt-thumb" id="ytThumb"></div>
  <div class="yt-meta">
    <h3 class="yt-title" id="ytTitle">YouTube</h3>
    <div class="yt-sub" id="ytSub"></div>
  </div>
</div>
<div class="yt-format-title" id="formatTitle">VIDEO</div>
<div class="yt-download-list" id="resultActions"></div>
</div>
<p class="tool-note">Mendukung link YouTube biasa maupun youtu.be. Ketersediaan kualitas dan audio bergantung pada video dan layanan API.</p>
</div>

<script>
const btn=document.getElementById('downloadBtn');
const input=document.getElementById('youtubeUrl');
const status=document.getElementById('status');
const result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle');
const resultActions=document.getElementById('resultActions');
const ytThumb=document.getElementById('ytThumb');
const ytTitle=document.getElementById('ytTitle');
const ytSub=document.getElementById('ytSub');
const formatTitle=document.getElementById('formatTitle');

let selectedType='video';
let lastRoot=null;

document.querySelectorAll('.type-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selectedType=b.dataset.type;
    result.classList.remove('show');
    clearResult();
  });
});

function clearResult(){
  resultActions.innerHTML='';
  ytThumb.innerHTML='';
  ytTitle.textContent='YouTube';
  ytSub.textContent='';
  lastRoot=null;
}

function setStatus(text,show=true){
  status.textContent=text;
  status.classList.toggle('show',show);
}

function isYouTubeUrl(value){
  try{
    const u=new URL(value);
    const host=u.hostname.toLowerCase().replace(/^www\./,'');
    return ['youtube.com','m.youtube.com','youtu.be','youtube-nocookie.com'].includes(host);
  }catch(e){return false}
}

function getFirst(obj,keys){
  for(const key of keys){
    let value=obj;
    for(const part of key.split('.')){
      if(value==null) break;
      value=value[part];
    }
    if(value!==undefined && value!==null && value!=='') return value;
  }
  return null;
}

function normalizeItems(value){
  if(!value) return [];
  if(Array.isArray(value)) return value;
  if(typeof value==='object') return Object.values(value);
  return [];
}

function mediaUrl(item){
  if(typeof item==='string') return item;
  if(!item || typeof item!=='object') return null;
  return getFirst(item,[
    'url','download','download_url','downloadUrl','link','src',
    'video','audio','play','play_url','playUrl'
  ]);
}

function mediaLabel(item,index){
  if(typeof item==='string') return 'FILE '+(index+1);
  const q=getFirst(item,['quality','qualityLabel','resolution','label','name']);
  const ext=getFirst(item,['ext','extension','format']);
  return [q,ext].filter(Boolean).join(' ') || 'FILE '+(index+1);
}

function addDownload(label,url,item){
  if(!url) return;
  const a=document.createElement('a');
  const left=document.createElement('span');
  left.textContent=label;
  const icon=document.createElement('i');
  icon.className='fas fa-download';
  a.append(left,icon);
  a.href=url;
  a.target='_blank';
  a.rel='noopener noreferrer';
  resultActions.appendChild(a);
}

function showInfo(root){
  const title=getFirst(root,['title','name','video.title','data.title']) || 'YouTube Video';
  const thumb=getFirst(root,[
    'thumbnail','thumbnail_url','thumbnailUrl','cover','image',
    'data.thumbnail','video.thumbnail'
  ]);
  const channel=getFirst(root,[
    'channel','author','uploader','channelName',
    'data.channel','author.name','uploader.name'
  ]);
  const duration=getFirst(root,[
    'duration','durationText','length','data.duration','video.duration'
  ]);

  ytTitle.textContent=String(title);

  const sub=[channel ? 'Channel: '+channel : '',
             duration ? 'Durasi: '+duration : '']
             .filter(Boolean).join(' • ');
  ytSub.textContent=sub;

  if(thumb){
    const img=document.createElement('img');
    img.src=thumb;
    img.alt='Thumbnail YouTube';
    img.loading='eager';
    img.onerror=()=>{ytThumb.innerHTML='';};
    ytThumb.appendChild(img);
  }
}

function collectMedia(data){
  const root=(data && data.data) ? data.data : data;

  let medias=normalizeItems(getFirst(root,[
    'medias','media','formats','downloads','download'
  ]));

  // Also accept explicitly named video/audio arrays.
  let videos=normalizeItems(getFirst(root,[
    'videos','video','videoFormats','video_formats'
  ]));
  let audios=normalizeItems(getFirst(root,[
    'audios','audio','audioFormats','audio_formats','music'
  ]));

  // If the API uses one mixed formats array, split it by metadata.
  if(medias.length){
    const mixedVideos=medias.filter(x=>{
      const s=JSON.stringify(x).toLowerCase();
      return mediaUrl(x) && (
        /video/.test(String(x?.type||'').toLowerCase()) ||
        /video\//.test(String(x?.mimeType||'').toLowerCase()) ||
        /mp4/.test(String(x?.ext||x?.extension||'').toLowerCase())
      );
    });
    const mixedAudios=medias.filter(x=>{
      const s=JSON.stringify(x).toLowerCase();
      return mediaUrl(x) && (
        /audio/.test(String(x?.type||'').toLowerCase()) ||
        /audio\//.test(String(x?.mimeType||'').toLowerCase()) ||
        /mp3|m4a|aac|opus/.test(String(x?.ext||x?.extension||'').toLowerCase())
      );
    });
    if(!videos.length) videos=mixedVideos;
    if(!audios.length) audios=mixedAudios;
  }

  // Direct URL fallbacks.
  if(!videos.length){
    const one=getFirst(root,['video_url','videoUrl','play','video','download_url','downloadUrl']);
    if(one) videos=[one];
  }
  if(!audios.length){
    const one=getFirst(root,['audio_url','audioUrl','music_url','musicUrl','audio','music']);
    if(one) audios=[one];
  }

  // Keep every valid video URL. The browser can play muxed MP4 directly;
  // video-only streams are still downloadable if the API exposes them.
  videos=videos.filter(x=>mediaUrl(x));
  audios=audios.filter(x=>mediaUrl(x));

  return {root,videos,audios};
}

async function downloadYouTube(){
  const url=input.value.trim();
  result.classList.remove('show');
  clearResult();

  if(!url){
    setStatus('Silakan tempel link YouTube terlebih dahulu.');
    return;
  }
  if(!isYouTubeUrl(url)){
    setStatus('Link harus berupa link YouTube yang valid.');
    return;
  }

  btn.disabled=true;
  btn.style.opacity='.6';
  setStatus('MEMPROSES YOUTUBE...');

  try{
    const api=selectedType==='mp3'
      ? 'https://jerrycoder.oggyapi.workers.dev/down/ytmp3?url='+encodeURIComponent(url)
      : 'https://jerrycoder.oggyapi.workers.dev/down/youtube?url='+encodeURIComponent(url);
    const response=await fetch(api,{headers:{'Accept':'application/json'}});
    if(!response.ok) throw new Error('HTTP '+response.status);

    const json=await response.json();

    if(selectedType==='mp3'){
      if(json && (json.status==='error' || json.success===false)){
        throw new Error(json.message || json.msg || 'MP3 tidak ditemukan.');
      }

      const mp3Url=json?.url || json?.download || json?.download_url || json?.audio_url;
      if(!mp3Url){
        throw new Error('URL MP3 tidak ditemukan dari API.');
      }

      const title=json?.title || 'YouTube MP3';
      const quality=json?.quality || 'MP3';
      const duration=json?.duration ? 'Durasi: '+json.duration : '';

      // MP3 API tidak menyediakan thumbnail, jadi gunakan thumbnail musik bawaan.
      ytThumb.innerHTML='';
      const musicThumb=document.createElement('div');
      musicThumb.style.cssText=[
        'width:100%',
        'height:100%',
        'min-height:220px',
        'display:flex',
        'align-items:center',
        'justify-content:center',
        'background:linear-gradient(135deg,#17181c,#292b31)'
      ].join(';');
      musicThumb.innerHTML='<i class="fas fa-music" style="font-size:5rem;color:#aaa"></i>';
      ytThumb.appendChild(musicThumb);

      ytTitle.textContent=title;
      ytSub.textContent=[quality,duration].filter(Boolean).join(' • ');

      const seen=new Set();
      if(!seen.has(mp3Url)){
        seen.add(mp3Url);
        addDownload('MP3 '+String(quality).toUpperCase(),mp3Url,json);
      }

      const count=seen.size;
      if(!count) throw new Error('URL MP3 tidak ditemukan dari API.');

      resultTitle.textContent='MP3 ditemukan';
      formatTitle.textContent='MP3';
      result.classList.add('show');
      setStatus('Berhasil menemukan MP3. Pilih tombol untuk download.',true);
      return;
    }

    if(json && json.success===false){
      throw new Error(json.message || json.msg || 'Media tidak ditemukan.');
    }

    const {root,videos,audios}=collectMedia(json);
    const items=selectedType==='video' ? videos : audios;

    if(!items.length){
      throw new Error(selectedType==='video'
        ? 'Kualitas video tidak tersedia dari API.'
        : 'Audio tidak tersedia dari API.');
    }

    showInfo(root);

    const seen=new Set();
    items.forEach((item,i)=>{
      const u=mediaUrl(item);
      if(!u || seen.has(u)) return;
      seen.add(u);
      addDownload(mediaLabel(item,i).toUpperCase(),u,item);
    });

    const count=seen.size;
    if(!count) throw new Error('URL media tidak ditemukan pada response API.');

    // Keep this text generic: no video/audio title appended.
    resultTitle.textContent=selectedType==='video' ? 'Video ditemukan' : selectedType==='mp3' ? 'MP3 ditemukan' : 'Audio ditemukan';
    formatTitle.textContent=selectedType==='video' ? 'VIDEO' : selectedType==='mp3' ? 'MP3' : 'AUDIO';
    result.classList.add('show');
    setStatus(selectedType==='video'
      ? 'Berhasil menemukan '+count+' video yang sudah menyatu dengan audio. Pilih kualitas untuk download.'
      : 'Berhasil menemukan '+count+' file audio. Pilih file untuk download.',true);
  }catch(err){
    setStatus('Gagal: '+(err.message || 'Terjadi kesalahan.')+' Coba lagi dengan link YouTube publik lain.',true);
  }finally{
    btn.disabled=false;
    btn.style.opacity='1';
  }
}

btn.addEventListener('click',downloadYouTube);
input.addEventListener('keydown',e=>{if(e.key==='Enter')downloadYouTube();});
</script>
